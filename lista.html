<!DOCTYPE html>
<html>
<head>
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Lista de Tarefas</h1>

        <p id="mensagem"></p>

        <table id="tabela" style="display: none;">
            <tr>
                <th>#</th>
                <th>Prioridade</th>
                <th>Descrição</th>
                <th>Local</th>
                <th>Recursos</th>
                <th>Data Limite</th>
                <th>Matrícula</th>
            </tr>

            <tbody id="corpo-tabela"></tbody>
        </table>

        <a href="index.html">
            <button>Voltar ao Cadastro</button>
        </a>

    </div>

    <script src="script.js"></script>
</body>
</html>
